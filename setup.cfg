[metadata]
name = spectral-analysis
version = 2.1.0
author = Seth Parker
author_email = c.seth.parker@uky.edu
description = Tools for processing and analyzing spectral datasets
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/educelab/spectral-analysis
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)
    Operating System :: OS Independent

[options]
packages = find:
install_requires = file: requirements.txt
python_requires = >=3.10

[options.packages.find]
include = spec_tools*
exclude = tests

[options.entry_points]
console_scripts =
    spec-enhance = spec_tools.apps.enhance:main
    spec-pca = spec_tools.apps.pca:main
    spec-apply-flats = spec_tools.apps.apply_flats:main