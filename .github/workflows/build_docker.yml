name: Build Docker image

# Runs independently of CI rather than gating on it: the image build is itself a
# real check (a broken install fails it). A red test suite can still publish a
# tagged image.
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

concurrency: docker

env:
  REGISTRY: ghcr.io
  REGISTRY_IMAGE: educelab/spectral-analysis

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE }}
          # `latest` tracks the most recent release tag; `edge` tracks main.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The arm64 leg builds under emulation, so expect a slow job. Nothing
      # needs compiling (cp312 wheels exist for both arches), but the ExifTool
      # source build and pip install are both emulated.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
