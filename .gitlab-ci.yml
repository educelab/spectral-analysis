stages:
  - test
  - deploy

### Tests ###
.test:
  before_script:
    - apt update
    - apt install -y exiftool && apt upgrade -y
    - python -m pip install --upgrade pip setuptools wheel
  script:
    - python -m pip install .
    - spec-enhance -h
    - python -m unittest -v tests.test_spec_tools

test:3.10:
  extends: .test
  stage: test
  image: python:3.10

test:3.11:
  extends: .test
  stage: test
  image: python:3.10

